[package]
name = "rag-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A batteries-included-but-swappable embedded RAG engine for Rust"
readme = "README.md"
repository = "https://github.com/ryanpappal/rust-local-rag"
documentation = "https://docs.rs/rag-core"
keywords = ["rag", "retrieval", "embeddings", "search", "nlp"]
categories = ["text-processing", "database", "algorithms"]
publish = true

[features]
default = []
persistence = ["dep:serde", "dep:serde_json"]
tracing = ["dep:tracing"]
# Enable object-safe dynamic dispatch traits (DynEmbeddingBackend, DynRerank)
dyn-backend = []

[dependencies]
regex = "1"
# BoxFuture for object-safe async traits
futures-core = "0.3"
srx = { version = "0.1", features = ["from_xml"] }
thiserror = "2"
tracing = { version = "0.1", optional = true }
uuid = { version = "1.17", features = ["v4"] }

serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[[bench]]
name = "search"
harness = false
