name: Python Bindings CI

on:
  push:
    branches: [main]
    paths:
      - 'crates/rag-core-py/**'
      - 'crates/rag-core/**'
      - '.github/workflows/python-bindings.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/rag-core-py/**'
      - 'crates/rag-core/**'
      - '.github/workflows/python-bindings.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Rust unit tests (fast, runs on all platforms)
  rust-tests:
    name: Rust Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Rust tests (rag-core-py)
        run: cargo test -p rag-core-py --verbose

      - name: Run Rust tests (rag-core)
        run: cargo test -p rag-core --verbose

  # Python integration tests
  python-tests:
    name: Python Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest pytest-asyncio

      - name: Build and install ragcore
        working-directory: crates/rag-core-py
        run: pip install .

      - name: Run Python tests
        working-directory: crates/rag-core-py
        run: pytest tests/ -v

  # Memory safety check (Linux only)
  asan-check:
    name: ASAN Memory Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest pytest-asyncio

      - name: Build with ASAN
        working-directory: crates/rag-core-py
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: |
          cargo +nightly build -p rag-core-py --target x86_64-unknown-linux-gnu -Zbuild-std
        continue-on-error: true  # ASAN builds can be flaky in CI

      - name: Run ASAN tests
        working-directory: crates/rag-core-py
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: |
          pip install .
          pytest tests/ -v
        continue-on-error: true  # Non-blocking for now

  # Build wheels for release
  build-wheels:
    name: Build Wheels (${{ matrix.os }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/rag-core-py
          args: --release --out dist
          sccache: 'true'

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: crates/rag-core-py/dist/*.whl
