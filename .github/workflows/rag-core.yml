name: rag-core CI

on:
  push:
    branches: [main, master]
    paths:
      - 'crates/rag-core/**'
      - '.github/workflows/rag-core.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'crates/rag-core/**'
      - '.github/workflows/rag-core.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test rag-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/rag-core

      - name: Check formatting
        run: cargo fmt -p rag-core -- --check

      - name: Clippy (no features)
        run: cargo clippy -p rag-core -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy -p rag-core --all-features -- -D warnings

      - name: Test (no features)
        run: cargo test -p rag-core

      - name: Test (all features)
        run: cargo test -p rag-core --all-features

      - name: Build examples
        run: cargo build -p rag-core --examples --all-features

      - name: Build docs
        run: cargo doc -p rag-core --no-deps --all-features

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@1.85

      - name: Check MSRV
        run: cargo check -p rag-core --all-features
